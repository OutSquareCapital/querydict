[project]
dependencies    = [
 "jmespath>=1.0.1",
]
description     = "JMESPath in method chaining style"
name            = "querydict"
readme          = "README.md"
requires-python = ">=3.12"
version         = "0.1.0"
[build-system]
build-backend = "uv_build"
requires      = ["uv_build>=0.8.15,<0.9.0"]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=37.12.0",
    "polars==1.34.0",
]
